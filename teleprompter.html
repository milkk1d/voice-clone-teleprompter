<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Teleprompter · Clona tu voz</title>
<meta name="description" content="Teleprompter tipo karaoke para grabar tu voz y clonarla con IA: énfasis, pausas y entonación marcados en cada frase.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230A1330%27/%3E%3Cpath d=%27M12 8l11 8-11 8z%27 fill=%27%23E0473C%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: escenario a pantalla completa; el guion sube detrás de una franja de lectura fija (36 % de la altura); controles abajo.
   Un solo look oscuro a propósito: fondo de océano profundo, texto crema y la palabra clave subrayada en rojo.
   Las palabras crecen en tamaño y peso según la fuerza con que se dicen (de menos a más hasta la subrayada).
   Lee el formato de la especificación: # sección, @fuerza, > nota, **énfasis**, [pausa], [respira], [sube]/[baja],
   tramos [lento] [rápido] [suave] [fuerte] y pronunciación palabra{pro-nun-CIA}. */
:root {
  --ground: #0A1330;
  --band: #15234D;
  --paper: #F4EBD8;
  --muted: #8C93AD;
  --red: #C8372D;
  --sky: #8AD6F0;
  --sky-soft: rgba(138, 214, 240, .32);
  --paper-dim: rgba(244, 235, 216, .42);
  --ocre: #D9A55B;
  --rule: #26325C;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --fs: 44px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--ground);
  color: var(--paper);
  font-family: var(--display);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
*, *::before, *::after { box-sizing: inherit; }

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap;
  padding-block: 10px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--rule);
}
.top b { color: var(--paper); font-weight: 500; }
.picker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.picker select {
  font: inherit; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--paper);
  background: var(--band); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; max-width: min(78vw, 30rem);
}
.picker select:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.home { color: var(--muted); text-decoration: none; white-space: nowrap; }
.home:hover { color: var(--paper); }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.lang button { font: inherit; letter-spacing: inherit; color: var(--muted); background: none; border: 0; padding: 2px 9px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--paper); color: var(--ground); }
dialog .pick-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
dialog label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
dialog select { font: 13px var(--mono); color: var(--paper); background: var(--band); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; }
.issues { margin: 10px 0 0; padding: 10px 12px 10px 28px; max-height: 22vh; overflow: auto; background: var(--band); border: 1px solid var(--rule); border-radius: 4px; line-height: 1.5; }
.issues li.error { color: #F08A82; }
.issues li.aviso { color: var(--ocre); }
.issues li.ok { color: var(--sky); list-style: none; margin-left: -16px; }
.status { display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill[data-s="leyendo"] { color: var(--paper); border-color: var(--red); }
.pill[data-s="leyendo"] i { background: var(--red); }
.pill[data-s="silencio"] { color: var(--sky); border-color: var(--sky); }
.pill[data-s="silencio"] i { background: var(--sky); }

.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: ns-resize; }
.band {
  position: absolute; left: 0; right: 0;
  top: calc(36% - var(--fs) * .3);
  height: calc(var(--fs) * 2);
  background: var(--band);
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  pointer-events: none;
}
.band::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  border-left: 12px solid var(--red); border-top: 9px solid transparent; border-bottom: 9px solid transparent;
}
.scroller { position: absolute; left: 0; right: 0; top: 0; will-change: transform; padding-bottom: 70vh; }
.col { max-width: min(100%, 22em); margin: 0 auto; font-size: var(--fs); padding-inline: 24px; text-align: center; }

.sec { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; margin: 1.1em 0 .6em; font-family: var(--mono); font-size: max(12px, calc(var(--fs) * .3)); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sec:first-child { margin-top: 0; }
.sec b { color: var(--paper); font-weight: 500; }
.sec .note { text-transform: none; letter-spacing: .02em; }
.force { display: inline-flex; align-items: center; gap: 4px; color: var(--ocre); }
.force i { display: inline-block; width: .9em; height: .55em; border: 1px solid var(--ocre); }
.force i.on { background: var(--ocre); }

.ln { margin: 0 0 .5em; line-height: 1.38; transition: opacity .25s ease; opacity: .5; text-wrap: pretty; }
.ln.past { opacity: .2; }
.ln.cur { opacity: 1; }
/* karaoke: cada palabra se pinta de celeste de izquierda a derecha mientras se dice */
.ln.cur .w {
  color: transparent;
  background-image: linear-gradient(90deg, var(--sky) var(--p, 0%), var(--paper-dim) var(--p, 0%));
  -webkit-background-clip: text; background-clip: text;
}
.ln.cur .pz { background-image: linear-gradient(90deg, var(--sky-soft) var(--p, 0%), transparent var(--p, 0%)); }
.w { font-variation-settings: "opsz" 72; }
.kw { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: .09em; text-underline-offset: .17em; }
.w.st-lento { letter-spacing: .06em; }
.w.st-rapido, .w.st-suave { font-style: italic; }
.pz {
  display: inline-block; font-family: var(--mono); font-size: .36em; font-weight: 500; color: var(--sky);
  border: 1px solid var(--sky); border-radius: 3px; padding: .05em .4em; margin: 0 .3em; vertical-align: .55em;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pz.rs { border-style: dashed; }
.pr { font-family: var(--mono); font-size: .32em; font-weight: 500; color: var(--ocre); vertical-align: .9em; margin-left: .1em; white-space: nowrap; }
.tg {
  display: inline-block; font-family: var(--mono); font-size: .3em; font-weight: 500; text-transform: uppercase; letter-spacing: .08em;
  border: 1px solid currentColor; border-radius: 3px; padding: .05em .4em; margin-right: .3em; vertical-align: .6em; white-space: nowrap;
}
.tg-lento { color: var(--sky); }
.tg-rapido { color: var(--ocre); }
.tg-suave { color: var(--muted); }
.tg-fuerte { color: var(--red); }
.ar { font-family: system-ui, "Segoe UI Symbol", sans-serif; font-size: .8em; }
.up { color: var(--sky); }
.dn { color: var(--ocre); }
.end { margin-top: 1.4em; font-family: var(--mono); font-size: max(13px, calc(var(--fs) * .36)); color: var(--sky); line-height: 1.5; }
.end .next { display: block; margin-top: 1.2em; padding: .8em 1em; border: 1px solid var(--rule); border-radius: 6px; color: var(--paper); font-size: .85em; }
.end .next a, .intro .links a { color: var(--sky); }
.end .next small { display: block; margin-top: .4em; color: var(--muted); font-size: .8em; }
.intro .links small { color: var(--muted); }

.pause {
  position: absolute; right: 8px; top: calc(36% - var(--fs) * .3 - 46px);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky);
  background: var(--ground); border: 1px solid var(--sky); border-radius: 4px; padding: 6px 12px;
}
.pause b { font-size: 20px; font-weight: 500; color: var(--paper); letter-spacing: 0; font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.pause .meter { width: 90px; height: 6px; background: var(--rule); }
.pause .meter u { display: block; height: 100%; background: var(--sky); width: 100%; }

/* panel "Listo para grabar": compacto, abajo, para que se vean las primeras líneas del guion detrás */
.intro {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px;
  width: min(100%, 36rem); max-height: calc(60% - 20px); overflow: auto;
  background: var(--ground); border: 1px solid var(--rule); border-radius: 6px;
  padding: 14px 18px; font-family: var(--mono); font-size: 13px; line-height: 1.5; color: var(--muted);
  display: grid; gap: 10px; cursor: default;
}
.intro h2 { margin: 0; padding-right: 32px; font-family: var(--display); font-size: 21px; font-weight: 700; color: var(--paper); }
.intro p { margin: 0; }
.intro .close { position: absolute; top: 8px; right: 8px; padding: 2px 9px; font-size: 14px; color: var(--muted); }
.intro .steps { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--paper); }
.intro .steps b { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 5px; border: 1px solid var(--ocre); border-radius: 50%; color: var(--ocre); font-size: 11px; font-weight: 500; }
.intro table { border-collapse: collapse; width: 100%; }
.intro td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: middle; }
.intro td:first-child { padding-right: 14px; white-space: nowrap; color: var(--paper); }
.intro td.demo { font-family: var(--display); font-size: 17px; }
.intro .pz, .intro .tg { font-size: 11px; vertical-align: middle; margin: 0 4px 0 0; }
.intro .ar { font-size: 17px; }
.intro .keys kbd { margin-right: 2px; }
.intro details { border-top: 1px solid var(--rule); padding-top: 8px; }
.intro summary { cursor: pointer; color: var(--sky); }
.intro details ul { margin: 8px 0 0; padding-left: 1.2em; display: grid; gap: 4px; }
.intro details b { color: var(--paper); font-weight: 500; }
.intro .links a { color: var(--sky); }
.help { font: inherit; letter-spacing: 0; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 50%; width: 22px; height: 22px; padding: 0; line-height: 20px; cursor: pointer; }
.help:hover { color: var(--paper); border-color: var(--muted); }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 5px; color: var(--paper); }

.count {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
}
.count .n { font-size: clamp(90px, 22vw, 200px); font-weight: 700; line-height: 1; color: var(--paper); font-variant-numeric: tabular-nums; }
.count .m { font-family: var(--mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--sky); }

.controls {
  border-top: 1px solid var(--rule);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 18px;
  font-family: var(--mono); font-size: 13px; color: var(--muted);
  position: relative;
}
.progress { position: absolute; left: 0; right: 0; top: -1px; height: 2px; }
.progress i { display: block; height: 100%; width: 0; background: var(--red); }
.grp { display: flex; align-items: center; gap: 6px; }
.grp .val { min-width: 4.5em; text-align: center; color: var(--paper); font-variant-numeric: tabular-nums; }
button {
  font: inherit; color: var(--paper); background: transparent; border: 1px solid var(--rule); border-radius: 4px;
  padding: 7px 12px; cursor: pointer; line-height: 1.2;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
button.main { background: var(--paper); color: var(--ground); border-color: var(--paper); font-weight: 500; min-width: 9.5em; }
button.main:hover { background: #fff; }

dialog {
  width: min(92vw, 44rem); max-height: 86vh; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--ground); color: var(--paper); font-family: var(--mono); font-size: 13px;
}
dialog::backdrop { background: rgba(5, 10, 26, .7); }
dialog h2 { margin: 0 0 6px; font-family: var(--display); font-size: 22px; }
dialog p { margin: 0 0 10px; color: var(--muted); line-height: 1.5; }
dialog textarea {
  width: 100%; height: 46vh; resize: vertical; font: 13px/1.5 var(--mono); color: var(--paper);
  background: var(--band); border: 1px solid var(--rule); border-radius: 4px; padding: 10px;
}
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }

@media (max-width: 560px) {
  .col { padding-inline: 18px; }
  .top { font-size: 11px; }
  .controls { gap: 8px 10px; }
  .hide-sm { display: none; }
  .pause { font-size: 12px; }
  .pause .meter { width: 50px; }
}
@media (prefers-reduced-motion: reduce) {
  .ln { transition: none; }
}
</style>

<header class="top">
  <div class="picker">
    <a class="home" href="index.html" id="homeLink">← Inicio</a>
    <select id="pick" aria-label="Elegir guion"></select>
  </div>
  <div class="status">
    <button type="button" class="help" id="helpBtn" aria-label="Ayuda">?</button>
    <span class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></span>
    <span class="pill" id="pill" data-s="pausa"><i></i><span id="pillTxt">En pausa</span></span>
    <span id="clock">0:00 / 0:00</span>
    <span id="lineNo" class="hide-sm">línea 1 de 1</span>
  </div>
</header>

<main class="stage" id="stage" aria-label="Guion">
  <div class="band" aria-hidden="true"></div>
  <div class="scroller" id="scroller"><div class="col" id="col"></div></div>

  <div class="pause" id="pause" hidden aria-live="off">
    <span id="pauseLbl">Pausa</span>
    <b id="pauseS">0,0 s</b>
    <span class="meter" aria-hidden="true"><u id="pauseBar"></u></span>
  </div>

  <section class="intro" id="intro"></section>

  <div class="count" id="count" hidden>
    <div class="n" id="countN">3</div>
    <div class="m" id="countM">Silencio</div>
  </div>
</main>

<footer class="controls">
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <div class="grp">
    <button id="prev" type="button" aria-label="Línea anterior">←</button>
    <button id="play" type="button" class="main">Empezar</button>
    <button id="next" type="button" aria-label="Línea siguiente">→</button>
  </div>
  <div class="grp" aria-label="Velocidad">
    <button id="slower" type="button" aria-label="Más lento">−</button>
    <span class="val" id="wpm">140 ppm</span>
    <button id="faster" type="button" aria-label="Más rápido">+</button>
  </div>
  <div class="grp" aria-label="Tamaño de letra">
    <button id="smaller" type="button" aria-label="Letra más chica">A−</button>
    <button id="bigger" type="button" aria-label="Letra más grande">A+</button>
  </div>
  <div class="grp">
    <button id="restart" type="button">Reiniciar</button>
    <button id="full" type="button" class="hide-sm">Pantalla completa</button>
  </div>
</footer>

<dialog id="pasteDlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgHelp"></p>
  <div class="pick-row">
    <label><span id="dlgStyleLbl"></span><select id="dlgStyle"></select></label>
    <label><span id="dlgLangLbl"></span><select id="dlgLang"><option value="es">Español</option><option value="en">English</option></select></label>
  </div>
  <textarea id="pasteTxt" spellcheck="false" placeholder="# Mi primera sección&#10;@fuerza 4&#10;> Una nota para quien lee.&#10;&#10;¿Sabías que el mar es **salado**? [sube]"></textarea>
  <ul id="dlgIssues" class="issues" hidden></ul>
  <div class="row">
    <button id="pasteCancel" type="button"></button>
    <button id="pasteOk" type="button" class="main"></button>
  </div>
</dialog>

<script src="js/data.js"></script>
<script src="js/links.js"></script>
<script src="js/validator.js"></script>
<script src="scripts/scripts.js"></script>
<script>
// segundos de cada pausa automática o marcada
const P = { coma: 0.25, frase: 0.45, linea: 0.45, seccion: 1.8, pausa: 1.0, respira: 0.9 };
// cuánto se estira cada palabra dentro de un tramo
const SPEED = { lento: 1.35, rapido: 0.75, suave: 1.1, fuerte: 1 };
const SPAN = { lento: "lento", slow: "lento", "rápido": "rapido", rapido: "rapido", fast: "rapido", suave: "suave", soft: "suave", fuerte: "fuerte", loud: "fuerte" };
const SPAN_LABEL = { lento: "lento", rapido: "rápido", suave: "suave", fuerte: "fuerte" };
const SYL = { es: 2.2, en: 1.5 }; // sílabas promedio por palabra

const $ = (id) => document.getElementById(id);
const stage = $("stage"), scroller = $("scroller"), col = $("col");

const store = {
  get(k, d) { try { const v = localStorage.getItem("tp." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tp." + k, JSON.stringify(v)); } catch (e) {} },
};
// --- idioma de la interfaz (el del guion es aparte: state.lang) ---
let ui = store.get("ui", (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
const T = {
  es: {
    home: "← Inicio", help: "Ayuda", title: "Teleprompter · Clona tu voz", pick: "Elegir guion", restart: "Reiniciar", full: "Pantalla completa",
    pill: { leyendo: "Leyendo", pausa: "En pausa", silencio: "Silencio", fin: "Terminado" },
    start: "Empezar", pauseBtn: "Pausa", resume: "Seguir", silence: "Silencio", backIn: "Sigue en",
    pause: "Pausa", breathe: "Respira", force: "Fuerza",
    line: (i, n) => `línea ${i} de ${n}`,
    end: "Fin del guion. Quédate 2 segundos en silencio y detén la grabación en Audacity.",
    empty: "Este guion no tiene líneas para leer. Revisa el formato.",
    span: { lento: "lento", rapido: "rápido", suave: "suave", fuerte: "fuerte" },
    myGroup: "Mi guion", ownGroup: "Ejemplos", pasted: "Guion pegado", pasteOpt: "Pegar un guion…",
    dlgTitle: "Pega tu guion", dlgStyle: "Estilo", dlgLang: "Idioma del guion",
    dlgHelp: "Usa el formato del guion: <code># Sección</code>, <code>@fuerza 4</code>, <code>&gt; nota</code>, <code>**palabra**</code>, <code>[pausa]</code>, <code>[respira]</code>, <code>[sube]</code>/<code>[baja]</code>, <code>[lento]…[/lento]</code>. Si lo copiaste de una IA, pega solo lo que está dentro del bloque de código. Al usarlo, lo revisamos según el estilo.",
    cancel: "Cancelar", check: "Revisar y usar", anyway: "Usar igual",
    fixErrors: "Corrige lo que está en rojo antes de usarlo.", warnsOnly: "Se puede leer igual; estos avisos ayudan a que el clon quede mejor:",
    intro: `<button type="button" class="close" data-close aria-label="Cerrar">✕</button>
      <h2>Listo para grabar</h2>
      <p class="steps"><span><b>1</b>Elige un guion arriba</span><span><b>2</b>Graba en Audacity</span><span><b>3</b>Presiona <kbd>Espacio</kbd> (3 s de silencio y empieza)</span></p>
      <table><tbody>
        <tr><td class="demo"><span style="font-size:.84em;font-weight:330">Casi</span> <span style="font-size:.9em;font-weight:420">uno</span> <span style="font-size:.96em;font-weight:520">de</span> <span style="font-size:1.03em;font-weight:620">cada</span> <span class="kw" style="font-size:1.18em;font-weight:800">cuatro</span></td><td>Sube la fuerza hasta la subrayada</td></tr>
        <tr><td><span class="pz">1 s</span></td><td>Pausa</td></tr>
        <tr><td><span class="ar up">↗</span> <span class="ar dn">↘</span></td><td>La voz sube o baja</td></tr>
        <tr><td><span class="tg tg-lento">lento</span><span class="tg tg-rapido">rápido</span></td><td>Cambia el ritmo</td></tr>

function dynamics(seg) {

  const groups = new Map();
  for (const g of sorted) {
    const label = g.estilo === "example" ? tr("ownGroup") : `${styleName(g.estilo)} · ${g.idioma.toUpperCase()}`;
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(g);
  }
  let html = "";
  for (const [label, list] of groups) {
    html += `<optgroup label="${esc(label)}">` + list.map((g) => `<option value="${esc(g.id)}">${g.tema ? g.tema + ". " : ""}${esc(g.titulo)}</option>`).join("") + "</optgroup>";
  }
  const pasted = store.get("pegado", "");
  html += `<optgroup label="${esc(tr("myGroup"))}">${pasted ? `<option value="${PASTED}">${esc(tr("pasted"))}</option>` : ""}<option value="${PASTE}">${esc(tr("pasteOpt"))}</option></optgroup>`;
  pick.innerHTML = html;
  pick.setAttribute("aria-label", tr("pick"));
  if (selected) pick.value = selected;
}
function loadScript(text, opts) {
  pause();
  state.lang = opts.lang || (/(@energy|\[(pause|breathe|up|down|slow|fast|soft|loud)\b)/i.test(text) ? "en" : "es");
  if (opts.ppm) state.wpm = opts.ppm;
  renderScript(parseScript(text));
  total = 0; state.t = 0; lastI = -1; lastSec = -1;
  build(); syncUI(); measure(); setPill("pausa");
  document.fonts?.ready.then(measure);
}
function choose(id) {
  if (id === PASTE) { openPaste(); return; }
  if (id === PASTED && !store.get("pegado", "")) id = LISTOS[0]?.id;
  if (id === PASTED) {
    const st = store.get("pegadoEstilo", "");
    loadScript(store.get("pegado", ""), { lang: store.get("pegadoIdioma", ""), ppm: D.styles[st]?.ppm });
    store.set("elegido", id);
    $("pick").value = PASTED;
    return;
  }
  // si el guion no existe, se abre el primer Documental en el idioma de la interfaz
  const g = LISTOS.find((x) => x.id === id) || LISTOS.find((x) => x.idioma === ui && x.estilo === "documentary") || LISTOS[0];
  if (!g) { loadScript("", {}); return; }
  loadScript(g.texto, { lang: g.idioma, ppm: g.ppm });
  store.set("elegido", g.id);
  $("pick").value = g.id;
}

// --- pegar un guion propio, con revisión según el estilo ---
let target = { words: 0, sections: 0 }, anyway = false;
function openPaste(pre = {}) {
  $("dlgStyle").innerHTML = D.order.map((k) => `<option value="${k}">${esc(styleName(k))}</option>`).join("");
  $("dlgStyle").value = pre.style && D.styles[pre.style] ? pre.style : D.styles[store.get("pegadoEstilo")] ? store.get("pegadoEstilo") : "documentary";
  $("dlgLang").value = pre.lang === "en" || pre.lang === "es" ? pre.lang : store.get("pegadoIdioma", ui);
  target = { words: pre.words || 0, sections: pre.sections || 0 };
  $("pasteTxt").value = store.get("pegado", "");
  resetCheck();
  $("pasteDlg").showModal();
}
function resetCheck() { anyway = false; $("dlgIssues").hidden = true; $("pasteOk").textContent = tr("check"); }
function acceptPaste(text) {
  store.set("pegado", text);
  store.set("pegadoEstilo", $("dlgStyle").value);
  store.set("pegadoIdioma", $("dlgLang").value);
  $("pasteDlg").close();
  fillPicker(PASTED);
  choose(PASTED);
}
$("pick").addEventListener("change", (e) => { choose(e.target.value); e.target.blur(); });
$("pasteCancel").addEventListener("click", () => { $("pasteDlg").close(); $("pick").value = store.get("elegido", LISTOS[0]?.id || PASTE); });
["pasteTxt", "dlgStyle", "dlgLang"].forEach((id) => $(id).addEventListener("input", resetCheck));
$("pasteOk").addEventListener("click", () => {
  const text = $("pasteTxt").value.trim();
  if (!text) return;
  if (anyway || !window.Validador) { acceptPaste(text); return; }
  const r = window.Validador.validate(text, { lang: $("dlgLang").value, style: $("dlgStyle").value, words: target.words, sections: target.sections, ui });
  if (!r.issues.length) { acceptPaste(text); return; }
  const where = (i) => (i.line ? (ui === "es" ? `línea ${i.line}: ` : `line ${i.line}: `) : "");
  $("dlgIssues").innerHTML = `<li class="ok">${esc(r.errors ? tr("fixErrors") : tr("warnsOnly"))}</li>` +
    r.issues.slice().sort((a, b) => (a.sev === "error" ? 0 : 1) - (b.sev === "error" ? 0 : 1)).map((i) => `<li class="${i.sev}">${esc(where(i) + i.msg)}</li>`).join("");
  $("dlgIssues").hidden = false;
  if (!r.errors) { anyway = true; $("pasteOk").textContent = tr("anyway"); }
});

// --- textos de la interfaz en el idioma elegido ---
function applyLang() {
  document.documentElement.lang = ui;
  document.title = tr("title");
  $("homeLink").textContent = tr("home");
  $("helpBtn").setAttribute("aria-label", tr("help"));
  $("helpBtn").title = tr("help");
  $("restart").textContent = tr("restart");
  $("full").textContent = tr("full");
  $("intro").innerHTML = tr("intro");
  window.aplicarEnlaces?.($("intro"));
  $("dlgTitle").textContent = tr("dlgTitle");
  $("dlgHelp").innerHTML = tr("dlgHelp");
  $("dlgStyleLbl").textContent = tr("dlgStyle");
  $("dlgLangLbl").textContent = tr("dlgLang");
  $("pasteCancel").textContent = tr("cancel");
  if (!anyway) $("pasteOk").textContent = tr("check");
  document.querySelectorAll(".status .lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === ui)));
  fillPicker($("pick").value || store.get("elegido", ""));
  setPill($("pill").dataset.s || "pausa");
  syncUI();
}
document.querySelectorAll(".status .lang button").forEach((b) => b.addEventListener("click", () => {
  ui = b.dataset.lang;
  store.set("ui", ui);
  applyLang();
  if (state.t === 0 && !state.playing) choose($("pick").value); // vuelve a dibujar etiquetas y secciones en el idioma nuevo
  b.blur();
}));

// --- panel "Listo para grabar": ✕ lo cierra y lo recuerda; "?" lo vuelve a abrir ---
let introAsked = false;
$("intro").addEventListener("click", (e) => {
  if (!e.target.closest("[data-close]")) return;
  introAsked = false;
  store.set("introCerrado", true);
  syncUI();
});
$("helpBtn").addEventListener("click", (e) => {
  if (state.playing || state.counting) pause();
  introAsked = $("intro").hidden;
  syncUI();
  e.currentTarget.blur();
});

// --- reproducir ---
let wake = null, countTimer = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} }
function startCount() {
  if (!lines.length) return;
  if (state.t >= total) state.t = 0;
  let n = state.t === 0 ? 3 : 2;
  state.counting = true;
  $("count").hidden = false;
  $("countN").textContent = n;
  $("countM").textContent = state.t === 0 ? tr("silence") : tr("backIn");
  setPill("silencio");
  syncUI();
  keepAwake();
  countTimer = setInterval(() => {
    n -= 1;
    if (n > 0) { $("countN").textContent = n; return; }
    clearInterval(countTimer);
    $("count").hidden = true;
    state.counting = false;
    state.playing = true;
    setPill("leyendo");
    syncUI();
  }, 1000);
}
function pause() {
  clearInterval(countTimer);
  $("count").hidden = true;
  state.counting = false;
  state.playing = false;
  setPill(total && state.t >= total ? "fin" : "pausa");
  syncUI();
  try { wake?.release(); } catch (e) {}
}
function toggle() { introAsked = false; state.playing || state.counting ? pause() : startCount(); }
function seek(t) { state.t = Math.max(0, Math.min(total, t)); syncUI(); }
function jump(d) {
  if (!lines.length) return;
  const i = lineAt(state.t), L = lines[i];
  const k = d < 0 && state.t - L.start > 0.6 ? i : Math.max(0, Math.min(lines.length - 1, i + d));
  seek(lines[k].start);
}
function setWpm(v) { state.wpm = Math.max(90, Math.min(200, v)); build(); syncUI(); lastSec = -1; }
function setFs(v) { state.fs = Math.max(22, Math.min(96, v)); store.set("fs", state.fs); syncUI(); measure(); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (state.playing) {
    state.t += dt;
    if (state.t >= total) { state.t = total; pause(); }
  }
  render();
  requestAnimationFrame(frame);
}

// --- controles ---
const clickOnly = (fn) => (e) => { fn(); if (e.detail > 0) e.currentTarget.blur(); };
$("play").addEventListener("click", clickOnly(toggle));
$("prev").addEventListener("click", clickOnly(() => jump(-1)));
$("next").addEventListener("click", clickOnly(() => jump(1)));
$("slower").addEventListener("click", clickOnly(() => setWpm(state.wpm - 5)));
$("faster").addEventListener("click", clickOnly(() => setWpm(state.wpm + 5)));
$("smaller").addEventListener("click", clickOnly(() => setFs(state.fs - 4)));
$("bigger").addEventListener("click", clickOnly(() => setFs(state.fs + 4)));
$("restart").addEventListener("click", clickOnly(() => { pause(); seek(0); setPill("pausa"); }));
function fullscreen() { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(() => {}); }
$("full").addEventListener("click", clickOnly(fullscreen));

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ($("pasteDlg").open || e.target.closest?.("select, textarea, input")) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); if (!e.repeat) toggle(); }
  else if (k === "ArrowUp") { e.preventDefault(); setWpm(state.wpm + 5); }
  else if (k === "ArrowDown") { e.preventDefault(); setWpm(state.wpm - 5); }
  else if (k === "ArrowLeft") { e.preventDefault(); jump(-1); }
  else if (k === "ArrowRight") { e.preventDefault(); jump(1); }
  else if (k === "+" || k === "=") setFs(state.fs + 4);
  else if (k === "-" || k === "_") setFs(state.fs - 4);
  else if (k === "Home") { pause(); seek(0); }
  else if (k === "f" || k === "F") fullscreen();
});
stage.addEventListener("wheel", (e) => { e.preventDefault(); seek(state.t + e.deltaY * 0.012); }, { passive: false });
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".intro, a") || !lines.length) return;
  const span = tops[tops.length - 1] - tops[0] || 1;
  drag = { y: e.clientY, t: state.t, k: total / span };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => { if (drag) seek(drag.t + (drag.y - e.clientY) * drag.k); });
stage.addEventListener("pointerup", () => { drag = null; });
stage.addEventListener("pointercancel", () => { drag = null; });
addEventListener("resize", () => lines.length && measure());

// arranque: ?script=<id> abre un guion listo; ?paste=1 abre el cuadro para pegar (con estilo, idioma y largo esperados)
const params = new URLSearchParams(location.search);
const saved = store.get("elegido", LISTOS[0]?.id || PASTE);
const first = params.get("script") || (saved === PASTE ? LISTOS[0]?.id || PASTED : saved);
applyLang();
fillPicker(first);
choose(first);
if (params.get("paste")) {
  openPaste({ style: params.get("style"), lang: params.get("lang"), words: Number(params.get("words")) || 0, sections: Number(params.get("sections")) || 0 });
}
requestAnimationFrame(frame);
</script>
